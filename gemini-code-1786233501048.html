<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self-Hosted Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-center items-center p-6">

  <div class="max-w-4xl w-full">
    <!-- Header -->
    <header class="text-center mb-10">
      <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Home Server Dashboard</h1>
      <p class="text-gray-400 text-sm">Press <kbd class="px-2 py-1 bg-gray-800 rounded text-xs border border-gray-700">1</kbd> to <kbd class="px-2 py-1 bg-gray-800 rounded text-xs border border-gray-700">4</kbd> on your keyboard to quick-launch</p>
    </header>

    <!-- 4 Redirect Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Card 1: ZimaOS -->
      <a href="http://ZimaOS.colinfarr.com" target="_blank" class="group relative p-6 bg-gray-900 border border-gray-800 rounded-xl hover:border-cyan-500 hover:bg-gray-850 transition duration-200">
        <div class="flex items-center justify-between mb-4">
          <span class="text-xs font-semibold px-2.5 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 rounded-md">Key [1]</span>
          <svg class="w-5 h-5 text-gray-500 group-hover:text-cyan-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </div>
        <h2 class="text-xl font-bold text-white mb-1">ZimaOS</h2>
        <p class="text-gray-400 text-sm">ZimaOS.colinfarr.com</p>
      </a>

      <!-- Card 2: Jellyfin -->
      <a href="http://jellyfin.colinfarr.com" target="_blank" class="group relative p-6 bg-gray-900 border border-gray-800 rounded-xl hover:border-purple-500 hover:bg-gray-850 transition duration-200">
        <div class="flex items-center justify-between mb-4">
          <span class="text-xs font-semibold px-2.5 py-1 bg-purple-500/10 text-purple-400 border border-purple-500/20 rounded-md">Key [2]</span>
          <svg class="w-5 h-5 text-gray-500 group-hover:text-purple-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </div>
        <h2 class="text-xl font-bold text-white mb-1">Jellyfin</h2>
        <p class="text-gray-400 text-sm">jellyfin.colinfarr.com</p>
      </a>

      <!-- Card 3: Crafty -->
      <a href="http://Crafty.colinfarr.com" target="_blank" class="group relative p-6 bg-gray-900 border border-gray-800 rounded-xl hover:border-emerald-500 hover:bg-gray-850 transition duration-200">
        <div class="flex items-center justify-between mb-4">
          <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-md">Key [3]</span>
          <svg class="w-5 h-5 text-gray-500 group-hover:text-emerald-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </div>
        <h2 class="text-xl font-bold text-white mb-1">Crafty Controller</h2>
        <p class="text-gray-400 text-sm">Crafty.colinfarr.com</p>
      </a>

      <!-- Card 4: OpenSpeedTest -->
      <a href="http://OpenSpeedTest.colinfarr.com" target="_blank" class="group relative p-6 bg-gray-900 border border-gray-800 rounded-xl hover:border-amber-500 hover:bg-gray-850 transition duration-200">
        <div class="flex items-center justify-between mb-4">
          <span class="text-xs font-semibold px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-md">Key [4]</span>
          <svg class="w-5 h-5 text-gray-500 group-hover:text-amber-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </div>
        <h2 class="text-xl font-bold text-white mb-1">OpenSpeedTest</h2>
        <p class="text-gray-400 text-sm">OpenSpeedTest.colinfarr.com</p>
      </a>

    </div>
  </div>

  <!-- Keyboard shortcut handler -->
  <script>
    const sites = {
      '1': 'http://ZimaOS.colinfarr.com',
      '2': 'http://jellyfin.colinfarr.com',
      '3': 'http://Crafty.colinfarr.com',
      '4': 'http://OpenSpeedTest.colinfarr.com'
    };

    document.addEventListener('keydown', (e) => {
      // Prevents key trigger if user is typing in an input field
      if (['input', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) return;

      if (sites[e.key]) {
        window.open(sites[e.key], '_blank');
      }
    });
  </script>
</body>
</html>
