<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Chat</title>
  <!-- PubNub SDK for instant messaging without a custom backend -->
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .chat-card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 440px; height: 550px; display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: #2563eb; color: #fff; padding: 16px; font-size: 18px; font-weight: 600; text-align: center; }
    .message-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
    .msg-bubble.mine { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg-bubble.theirs { background: #e5e7eb; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }
    .sender-name { font-size: 11px; margin-bottom: 4px; font-weight: bold; opacity: 0.85; }
    .chat-input-area { padding: 12px; border-top: 1px solid #e5e7eb; background: #fff; display: flex; flex-direction: column; gap: 8px; }
    .input-row { display: flex; gap: 8px; }
    input { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; font-size: 14px; }
    input:focus { border-color: #2563eb; }
    #username { width: 100%; font-weight: bold; }
    #messageInput { flex: 1; }
    button { background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">Group Chat</div>
    <div class="message-area" id="messageArea"></div>
    <div class="chat-input-area">
      <input type="text" id="username" placeholder="Your name...">
      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // Random user identity generator so everyone gets a default name
    const myId = 'User_' + Math.floor(Math.random() * 1000);
    document.getElementById('username').value = myId;

    // Free public demo keys provided by PubNub
    const pubnub = new PubNub({
      publishKey: 'pub-c-7ca3a1c8-2b81-4202-b2d9-eb01bc5b4cb8',
      subscribeKey: 'sub-c-eb1d46b8-6a3f-11ed-b570-8e709e7c3761',
      userId: myId
    });

    const channelName = 'github_pages_chat_room';

    // Subscribe to the shared channel
    pubnub.subscribe({ channels: [channelName] });

    const messageArea = document.getElementById('messageArea');
    const usernameInput = document.getElementById('username');
    const messageInput = document.getElementById('messageInput');

    // Function to send a message
    function sendMessage() {
      const text = messageInput.value.trim();
      const user = usernameInput.value.trim() || 'Anonymous';

      if (text !== '') {
        pubnub.publish({
          channel: channelName,
          message: {
            sender: user,
            senderId: myId,
            text: text
          }
        });
        messageInput.value = '';
      }
    }

    // Listen for incoming messages from friends
    pubnub.addListener({
      message: function(event) {
        const msg = event.message;
        const isMine = msg.senderId === myId;

        const bubble = document.createElement('div');
        bubble.className = `msg-bubble ${isMine ? 'mine' : 'theirs'}`;
        bubble.innerHTML = `<div class="sender-name">${msg.sender}</div>${msg.text}`;

        messageArea.appendChild(bubble);
        messageArea.scrollTop = messageArea.scrollHeight;
      }
    });
  </script>
</body>
</html>
