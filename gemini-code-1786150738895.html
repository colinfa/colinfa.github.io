<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Peer-to-Peer Chat</title>
  <!-- PeerJS Library (Free open-source WebRTC connection) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
    .chat-card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; height: 600px; display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: #2563eb; color: #fff; padding: 14px; font-size: 18px; font-weight: 600; text-align: center; }
    
    .status-bar { background: #eff6ff; padding: 12px; font-size: 13px; border-bottom: 1px solid #e5e7eb; display: flex; flex-direction: column; gap: 6px; }
    .status-bar div { display: flex; align-items: center; justify-content: space-between; }
    .status-badge { font-weight: bold; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .offline { background: #fef2f2; color: #991b1b; }
    .online { background: #dcfce7; color: #166534; }
    
    .connect-row { display: flex; gap: 6px; margin-top: 4px; }
    .connect-row input { flex: 1; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }
    .connect-row button { padding: 6px 12px; font-size: 12px; }

    .message-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
    .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
    .msg-bubble.mine { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg-bubble.theirs { background: #e5e7eb; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg-bubble.system { background: #f1f5f9; color: #64748b; align-self: center; font-size: 12px; border-radius: 8px; text-align: center; }

    .chat-input-area { padding: 12px; border-top: 1px solid #e5e7eb; background: #fff; display: flex; gap: 8px; }
    input[type="text"] { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; font-size: 14px; }
    #messageInput { flex: 1; }
    button { background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">P2P Direct Chat</div>
    
    <div class="status-bar">
      <div>
        <span>Your Chat ID: <b id="my-id">Connecting...</b></span>
        <span id="status-tag" class="status-badge offline">Disconnected</span>
      </div>
      <div class="connect-row">
        <input type="text" id="friend-id-input" placeholder="Paste friend's Chat ID here...">
        <button onclick="connectToFriend()">Connect</button>
      </div>
    </div>

    <div class="message-area" id="messageArea">
      <div class="msg-bubble system">Share your Chat ID with a friend, or paste theirs above to start chatting!</div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="Type a message..." disabled onkeydown="if(event.key === 'Enter') sendMessage()">
      <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>
  </div>

  <script>
    let peer = null;
    let conn = null;

    // Create a unique short ID for this user
    const customId = 'user-' + Math.floor(1000 + Math.random() * 9000);

    // Initialize PeerJS
    peer = new Peer(customId);

    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
    });

    // Handle incoming connections from a friend
    peer.on('connection', (connection) => {
      conn = connection;
      setupConnection();
    });

    // Connect to a friend using their ID
    function connectToFriend() {
      const friendId = document.getElementById('friend-id-input').value.trim();
      if (!friendId) return alert("Please enter a friend's Chat ID!");
      
      addSystemMessage("Connecting to " + friendId + "...");
      conn = peer.connect(friendId);
      setupConnection();
    }

    // Bind event listeners when connected
    function setupConnection() {
      conn.on('open', () => {
        document.getElementById('status-tag').innerText = "Connected";
        document.getElementById('status-tag').className = "status-badge online";
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        addSystemMessage("Connected! You can now send messages.");
      });

      conn.on('data', (data) => {
        appendMessage(data, 'theirs');
      });

      conn.on('close', () => {
        document.getElementById('status-tag').innerText = "Disconnected";
        document.getElementById('status-tag').className = "status-badge offline";
        document.getElementById('messageInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        addSystemMessage("Friend disconnected.");
      });
    }

    // Send message to connected friend
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (text && conn) {
        conn.send(text);
        appendMessage(text, 'mine');
        input.value = '';
      }
    }

    function appendMessage(text, side) {
      const area = document.getElementById('messageArea');
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${side}`;
      bubble.innerText = text;
      area.appendChild(bubble);
      area.scrollTop = area.scrollHeight;
    }

    function addSystemMessage(text) {
      appendMessage(text, 'system');
    }
  </script>
</body>
</html>
