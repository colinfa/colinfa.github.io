<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colin Farr</title>
  <style>
    /* Global Styles */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      /* STEP 1: Dark Background and Light Text */
      background-color: #121212; /* A slightly softer matte black */
      color: #e0e0e0; /* A soft light grey for better readability */
      
      /* Layout Styles (Centering Content) */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    /* Container Styles */
    .container {
      max-width: 600px;
      padding: 2rem;
      border: 1px solid #333; /* Darker border */
      border-radius: 12px;
      background-color: #1e1e1e; /* Dark slate gray background for the card */
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
    }

    /* Typography Styles */
    h1 {
      margin-top: 0;
      color: #fff; /* Bright white for headlines */
      font-size: 2.5rem;
    }

    p {
      line-height: 1.6;
      font-size: 1.1rem;
    }

    /* Link Styles */
    a {
      color: #79b8ff; /* GitHub's bright blue link color */
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to ColinFarr.net</h1>
    <p>This site is currently under development and is proudly hosted using **GitHub Pages**.</p>
    <p>Check back soon for updates or explore the repository directly.</p>
    <p>
      <a href="www.youtube.com/@ColinJames13" target="_blank" rel="noopener noreferrer">
        View Project on GitHub
      </a>
    </p>
  </div>
</body>
</html>
