<script>
  let peer = null;
  let conn = null;

  // Ask for a custom username as soon as the page loads
  const username = prompt("Enter your name:") || ("user-" + Math.floor(1000 + Math.random() * 9000));
  
  // Clean the username (remove spaces/special characters so PeerJS accepts it)
  const myCleanId = username.toLowerCase().replace(/[^a-z0-9]/g, "");

  // Initialize PeerJS with the custom name
  peer = new Peer(myCleanId);

  peer.on('open', (id) => {
    document.getElementById('my-id').innerText = id;
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      alert("That name is already taken right now! Try another one.");
      location.reload();
    }
  });

  peer.on('connection', (connection) => {
    conn = connection;
    setupConnection();
  });

  function connectToFriend() {
    const friendId = document.getElementById('friend-id-input').value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
    if (!friendId) return alert("Please enter a friend's Chat ID!");
    
    addSystemMessage("Connecting to " + friendId + "...");
    conn = peer.connect(friendId);
    setupConnection();
  }

  function setupConnection() {
    conn.on('open', () => {
      document.getElementById('status-tag').innerText = "Connected";
      document.getElementById('status-tag').className = "status-badge online";
      document.getElementById('messageInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      addSystemMessage("Connected! You can now send messages.");
    });

    conn.on('data', (data) => {
      appendMessage(data, 'theirs');
    });

    conn.on('close', () => {
      document.getElementById('status-tag').innerText = "Disconnected";
      document.getElementById('status-tag').className = "status-badge offline";
      document.getElementById('messageInput').disabled = true;
      document.getElementById('sendBtn').disabled = true;
      addSystemMessage("Friend disconnected.");
    });
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (text && conn) {
      conn.send(text);
      appendMessage(text, 'mine');
      input.value = '';
    }
  }

  function appendMessage(text, side) {
    const area = document.getElementById('messageArea');
    const bubble = document.createElement('div');
    bubble.className = `msg-bubble ${side}`;
    bubble.innerText = text;
    area.appendChild(bubble);
    area.scrollTop = area.scrollHeight;
  }

  function addSystemMessage(text) {
    appendMessage(text, 'system');
  }
</script>
